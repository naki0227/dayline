[workspace]
resolver = "3"
members = [
    "crates/context-domain",
    "crates/context-engine",
    "crates/context-normalize",
    "crates/context-policy",
    "crates/context-query",
    "crates/context-ranking",
    "crates/context-redact",
    "crates/context-store",
    "crates/context-time",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2"
time = { version = ">=0.3.47, <0.4", features = ["formatting", "macros", "parsing", "serde", "serde-human-readable"] }
time-tz = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
