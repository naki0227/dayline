name: CD / OAuth Broker

on:
  push:
    tags: ["oauth-broker-v*"]
  workflow_dispatch:

concurrency:
  group: oauth-broker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/notion-oauth-broker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NOTION_CLIENT_ID: ${{ vars.NOTION_CLIENT_ID }}
      NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
      RATE_LIMIT_KEY_SECRET: ${{ secrets.RATE_LIMIT_KEY_SECRET }}
      NOTION_REDIRECT_URI: ${{ vars.NOTION_REDIRECT_URI }}
      BROKER_BASE_URL: ${{ vars.DAYLINE_NOTION_OAUTH_BROKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/notion-oauth-broker/package-lock.json
      - name: Verify deployment configuration
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID variable is required}"
          : "${NOTION_CLIENT_ID:?NOTION_CLIENT_ID variable is required}"
          : "${NOTION_CLIENT_SECRET:?NOTION_CLIENT_SECRET secret is required}"
          : "${RATE_LIMIT_KEY_SECRET:?RATE_LIMIT_KEY_SECRET secret is required}"
          : "${NOTION_REDIRECT_URI:?NOTION_REDIRECT_URI variable is required}"
          : "${BROKER_BASE_URL:?DAYLINE_NOTION_OAUTH_BROKER_URL variable is required}"
      - name: Install
        run: npm ci
      - name: Validate
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Update encrypted Worker secret
        run: printf '%s' "$NOTION_CLIENT_SECRET" | npx wrangler secret put NOTION_CLIENT_SECRET
      - name: Update rate-limit key secret
        run: printf '%s' "$RATE_LIMIT_KEY_SECRET" | npx wrangler secret put RATE_LIMIT_KEY_SECRET
      - name: Deploy
        run: >-
          npx wrangler deploy
          --var NOTION_CLIENT_ID:"$NOTION_CLIENT_ID"
          --var NOTION_REDIRECT_URI:"$NOTION_REDIRECT_URI"
          --var DAYLINE_CALLBACK_URL:dayline://oauth/notion
      - name: Verify health
        working-directory: ${{ runner.temp }}
        run: curl --fail --silent --show-error "${BROKER_BASE_URL%/}/health"
