name: CI / Apple App

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Link Rust FFI and verify iOS app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-toolchain
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test the app with the generated FFI artifact
        run: make app-build app-test
