name: CI / Rust-Swift FFI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-ffi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xcframework:
    name: Generate and verify XCFramework
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-toolchain
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build and verify FFI artifacts
        run: make ffi-check
