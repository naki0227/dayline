name: CI / Release Tools

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-release-tools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Format, lint, typecheck, test, compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - name: Install dependencies
        run: make asc-dev-venv
      - name: Release tool quality gates
        run: make release-tools-ci
