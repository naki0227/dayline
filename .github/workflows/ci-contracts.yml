name: CI / Contracts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-contracts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: JSON Schema and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - name: Install validator
        run: make contracts-venv
      - name: Validate contracts
        run: make contracts-check

