name: Dayline
options:
  bundleIdPrefix: com.enludus
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  ContextCoreKit:
    path: packages/ContextCoreKit
  AppleIntelligenceKit:
    path: packages/AppleIntelligenceKit
  ContextCaptureKit:
    path: packages/ContextCaptureKit
  ContextCoreFFIKit:
    path: packages/ContextCoreFFIKit
  DaylineProductKit:
    path: packages/DaylineProductKit
  NotionKit:
    path: integrations/NotionKit

targets:
  Dayline:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ContextCoreKit
      - package: AppleIntelligenceKit
      - package: ContextCaptureKit
      - package: ContextCoreFFIKit
      - package: DaylineProductKit
      - package: NotionKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dayline
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.enludus.Dayline.notion-oauth
            CFBundleURLSchemes: [dayline]
        DAYLINE_NOTION_OAUTH_BROKER_URL: $(DAYLINE_NOTION_OAUTH_BROKER_URL)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "一日の音声を記録し、端末上で文脈を整理するために使用します。"
        NSSpeechRecognitionUsageDescription: "録音した音声を端末上で文字起こしするために使用します。"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.Dayline
        PRODUCT_NAME: Dayline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        DAYLINE_NOTION_OAUTH_BROKER_URL: ""
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Dayline App Store"
          DEVELOPMENT_TEAM: $(DAYLINE_TEAM_ID)

  DaylineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Dayline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.DaylineUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Dayline:
    build:
      targets:
        Dayline: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DaylineUITests
