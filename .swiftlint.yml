included:
  - App
  - packages

excluded:
  - packages/ContextCoreKit/.build
  - packages/AppleIntelligenceKit/.build
  - packages/ContextCoreFFIKit/.build
  - packages/ContextCoreFFIKit/.artifacts
  - packages/ContextCoreFFIKit/.generated
  - packages/ContextCaptureKit/.build
  - packages/DaylineProductKit/.build

strict: true

disabled_rules:
  - trailing_comma

line_length:
  warning: 120
  error: 140

file_length:
  warning: 300
  error: 400

type_body_length:
  warning: 200
  error: 300
